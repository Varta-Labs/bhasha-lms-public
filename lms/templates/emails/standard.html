<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<meta name="viewport" content="width=device-width" />
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>{{ subject or "" }}</title>
</head>

{% set is_bhasha_auth_email = 'data-bhasha-auth-email' in (content or '') %}
<body style="margin: 0; padding: 0; background-color: #f7f2e8; color: #1f172b;">
	<table class="body-table" cellpadding="0" cellspacing="0" border="0" width="100%"
		style="width: 100%; min-width: 100%; margin: 0; padding: 0; border-collapse: collapse; background-color: #f7f2e8;">
		<tr>
			<td align="center" valign="top" style="padding: 48px 16px;">
				<table class="email-container" border="0" cellpadding="0" cellspacing="0" width="100%"
					style="width: 100%; max-width: 600px; border: 1px solid #e9e0f3; border-radius: 24px; background-color: #ffffff; box-shadow: 0 18px 48px rgba(61, 34, 111, 0.12);">
					<tr>
						<td align="center" valign="middle" style="padding: 36px 32px 22px;">
							<a href="{{ site_url }}" style="display: inline-block; text-decoration: none;">
								<img
									src="{{ site_url }}/assets/lms/frontend/bhasha-logo-text-transparent.png"
									width="160"
									height="38"
									alt="Bhasha"
									style="display: block; width: 160px; max-width: 100%; height: auto; border: 0;"
								/>
							</a>
						</td>
					</tr>
					{% if header and not is_bhasha_auth_email %}
					<tr>
						<td valign="top" style="padding: 0 32px;">
							{{ header }}
						</td>
					</tr>
					{% endif %}
					<tr>
						<td class="email-body" valign="top" style="padding: 0 32px 36px; color: #1f172b; font-size: 15px; line-height: 1.65;">
							{{ content }}
						</td>
					</tr>
					<tr>
						<td valign="top" style="padding: 0 32px 28px;">
							<table class="email-footer" border="0" cellpadding="0" cellspacing="0" width="100%"
								style="width: 100%; border-top: 1px solid #eee8f2;">
								<tr>
									<td valign="top" data-email-footer="true" style="padding-top: 20px; color: #7a7182; font-size: 12px; line-height: 1.6;">
										{{ footer }}
									</td>
								</tr>
								<tr>
									<td valign="top">
										<div class="print-html">{{ print_html or "" }}</div>
									</td>
								</tr>
							</table>
						</td>
					</tr>
				</table>
				<table border="0" cellpadding="0" cellspacing="0" width="100%" style="width: 100%; max-width: 600px;">
					<tr>
						<td align="center" style="padding: 18px 24px 0; color: #82798a; font-size: 12px; line-height: 1.5;">
							{{ _("Learn Indian languages with confidence.") }}
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>

</html>
